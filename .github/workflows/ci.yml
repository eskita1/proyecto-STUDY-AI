name: CI

on:
  push:
  pull_request:

jobs:
  backend-checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: studyai
          POSTGRES_PASSWORD: studyai
          POSTGRES_DB: studyai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studyai -d studyai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://studyai:studyai@localhost:5432/studyai_test
      TEST_DATABASE_URL: postgresql+psycopg://studyai:studyai@localhost:5432/studyai_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: backend
        run: pytest

      - name: Verify migrations
        working-directory: backend
        run: |
          alembic check
          alembic downgrade base
          alembic upgrade head

      - name: Run Ruff
        working-directory: backend
        run: ruff check .
